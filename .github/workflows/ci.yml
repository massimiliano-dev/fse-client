name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Secrets scan, lint, typecheck, unit tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:secrets
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  official-xsd:
    name: Validate the synthetic CDAs against the official XSD and LAB schematron (pinned it-fse-catalogs)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:catalogs
      - run: pnpm compile:schematron
      - run: pnpm --filter @massimiliano-dev/fse-validator... build
      - run: cd packages/validator && npm pack --dry-run
      - run: pnpm vitest run --project unit packages/validator/test/catalogs.test.ts packages/validator/test/schematron-lab.test.ts

  # Smoke test against the real FSE gateway, PRE environment, synthetic data only. Skipped unless the
  # repository variable FSE_GATEWAY_ENV is set to "pre". Never runs for pull requests (their code must
  # not see the certificates); the "fse-pre" environment should require a manual approval.
  gateway-smoke:
    name: Gateway smoke test (PRE)
    runs-on: ubuntu-latest
    needs: check
    if: ${{ github.event_name != 'pull_request' && vars.FSE_GATEWAY_ENV == 'pre' }}
    environment: fse-pre
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write credentials to private temporary files
        env:
          FSE_SIGN_CERT_PEM: ${{ secrets.FSE_SIGN_CERT_PEM }}
          FSE_SIGN_KEY_PEM: ${{ secrets.FSE_SIGN_KEY_PEM }}
          FSE_TLS_CERT_PEM: ${{ secrets.FSE_TLS_CERT_PEM }}
          FSE_TLS_KEY_PEM: ${{ secrets.FSE_TLS_KEY_PEM }}
          FSE_CONTEXT_JSON: ${{ secrets.FSE_CONTEXT_JSON }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/fse-credentials"
          mkdir -p "$dir"
          printf '%s' "$FSE_SIGN_CERT_PEM" > "$dir/sign-cert.pem"
          printf '%s' "$FSE_SIGN_KEY_PEM" > "$dir/sign-key.pem"
          printf '%s' "$FSE_TLS_CERT_PEM" > "$dir/tls-cert.pem"
          printf '%s' "$FSE_TLS_KEY_PEM" > "$dir/tls-key.pem"
          printf '%s' "$FSE_CONTEXT_JSON" > "$dir/context.json"
      - name: Run the smoke test
        env:
          FSE_GATEWAY_ENV: pre
          FSE_SIGN_CERT_FILE: ${{ runner.temp }}/fse-credentials/sign-cert.pem
          FSE_SIGN_KEY_FILE: ${{ runner.temp }}/fse-credentials/sign-key.pem
          FSE_SIGN_KEY_PASSPHRASE: ${{ secrets.FSE_SIGN_KEY_PASSPHRASE }}
          FSE_TLS_CERT_FILE: ${{ runner.temp }}/fse-credentials/tls-cert.pem
          FSE_TLS_KEY_FILE: ${{ runner.temp }}/fse-credentials/tls-key.pem
          FSE_TLS_KEY_PASSPHRASE: ${{ secrets.FSE_TLS_KEY_PASSPHRASE }}
          FSE_CONTEXT_FILE: ${{ runner.temp }}/fse-credentials/context.json
        run: pnpm test:gateway
      - name: Remove credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/fse-credentials"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high
